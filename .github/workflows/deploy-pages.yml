# Builds the game and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Works whether the project sits at the repository root or inside a sub-folder.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate the project folder
        id: locate
        run: |
          pkg=$(grep -l '"vite"' $(find . -name package.json -not -path '*/node_modules/*') | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$pkg" ]; then echo "No package.json with vite found" && exit 1; fi
          echo "dir=$(dirname "$pkg")" >> "$GITHUB_OUTPUT"
          echo "Project folder: $(dirname "$pkg")"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install
        run: npm ci
        working-directory: ${{ steps.locate.outputs.dir }}

      - name: Build
        run: npx vite build
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          # Served from https://<user>.github.io/<repo>/ — asset URLs need the repo prefix.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional AI defaults (Settings → Secrets and variables → Actions). Leave unset to let
          # visitors enter their own key in the page. A key set here is visible in the site's JS.
          VITE_AI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VITE_AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          VITE_AI_MODEL: ${{ vars.AI_MODEL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate.outputs.dir }}/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
