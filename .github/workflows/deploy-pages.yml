name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate the project folder
        id: locate
        run: |
          pkg=$(grep -l '"vite"' $(find . -name package.json -not -path '*/node_modules/*') | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$pkg" ]; then echo "No package.json with vite found" && exit 1; fi
          echo "dir=$(dirname "$pkg")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install
        run: npm ci
        working-directory: ${{ steps.locate.outputs.dir }}

      - name: Build
        run: npx vite build
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate.outputs.dir }}/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
